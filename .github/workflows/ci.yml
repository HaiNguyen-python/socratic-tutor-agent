name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy src
      - name: Tests (scripted provider only; no API keys, no network)
        run: pytest --cov-fail-under=80
      - name: Eval run (simulated students, traces to SQLite)
        run: tutor eval --per-persona 14
      - name: Upload traces
        uses: actions/upload-artifact@v4
        with:
          name: eval-traces
          path: reports/

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t socratic-tutor-agent:ci .
